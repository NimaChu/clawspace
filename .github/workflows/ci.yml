name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/web/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify public snapshot
        run: ./scripts/verify-public-snapshot.sh

      - name: Install website dependencies
        working-directory: platform/web
        run: npm ci

      - name: Install bundled app dependencies
        working-directory: platform/web/apps/sources/comeback
        run: npm ci

      - name: Build website
        working-directory: platform/web
        run: npm run build
